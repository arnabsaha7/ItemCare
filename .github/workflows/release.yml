name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            args: ""
          - label: Windows
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ItemCare ${{ github.ref_name }}"
          releaseBody: |
            ## ItemCare ${{ github.ref_name }}

            Download the installer for your platform from the assets below.

            | Platform | File |
            |---|---|
            | Windows | `.msi` or `.exe` |
            | macOS | `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`) |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            > Builds are not code-signed yet. Windows SmartScreen and macOS Gatekeeper may show a warning on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}